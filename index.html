<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>הכסף שלי 💕</title>

<style>
:root{
  --pink:#d85b91;
  --pink-dark:#b94778;
  --pink-light:#fff0f6;
  --pink-soft:#fff8fb;
  --text:#342c34;
  --muted:#857985;
  --border:#eadde4;
  --white:#ffffff;
  --danger:#c94b61;
  --green:#4f9b78;
  --shadow:0 8px 25px rgba(80,45,65,.08);
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:var(--pink-soft);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  max-width:620px;
  margin:auto;
  padding:22px 16px 115px;
}

/* HEADER */

header{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  margin-bottom:18px;
}

h1{
  margin:0;
  font-size:29px;
  font-weight:850;
}

.subtitle{
  color:var(--muted);
  margin-top:5px;
  font-size:14px;
}

/* MONTH SELECTOR */

.month-card{
  background:white;
  border-radius:21px;
  padding:12px;
  box-shadow:var(--shadow);
  margin-bottom:17px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.month-arrow{
  border:0;
  background:var(--pink-light);
  width:42px;
  height:42px;
  border-radius:14px;
  font-size:20px;
  color:var(--pink-dark);
}

.month-center{
  flex:1;
  text-align:center;
}

.month-title{
  font-size:16px;
  font-weight:800;
}

.month-subtitle{
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
}

.today-button{
  border:0;
  background:#f7eef3;
  color:var(--text);
  padding:7px 10px;
  border-radius:10px;
  font-size:11px;
  margin-top:6px;
}

/* CARDS */

.card{
  background:var(--white);
  border-radius:24px;
  padding:21px;
  box-shadow:var(--shadow);
  margin-bottom:17px;
}

.summary{
  background:linear-gradient(145deg,#fff,#fff1f7);
}

.summary-label{
  color:var(--muted);
  font-size:14px;
}

.total{
  font-size:39px;
  font-weight:850;
  color:var(--pink);
  margin:4px 0;
  direction:ltr;
  text-align:right;
}

.period{
  color:var(--muted);
  font-size:13px;
}

.stats{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:16px;
}

.stat{
  background:white;
  border-radius:17px;
  padding:13px;
}

.stat-title{
  color:var(--muted);
  font-size:12px;
}

.stat-value{
  font-weight:800;
  margin-top:3px;
}

/* SECTIONS */

.section-title{
  margin:0 0 14px;
  font-size:20px;
  font-weight:850;
}

/* CATEGORIES */

.category{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:13px 0;
  border-bottom:1px solid #f1e8ed;
}

.category:last-child{
  border-bottom:0;
}

.category-left{
  display:flex;
  align-items:center;
  gap:11px;
}

.category-icon{
  width:43px;
  height:43px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:var(--pink-light);
  border-radius:14px;
  font-size:21px;
}

.category-name{
  font-weight:650;
}

.category-amount{
  font-weight:800;
  direction:ltr;
}

.progress{
  height:5px;
  background:#f1e7ed;
  border-radius:10px;
  margin-top:6px;
  overflow:hidden;
  width:120px;
}

.progress-bar{
  height:100%;
  background:var(--pink);
  border-radius:10px;
}

/* PAYMENT */

.payment-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:14px 0;
  border-bottom:1px solid #f1e8ed;
}

.payment-row:last-child{
  border-bottom:0;
}

.payment-left{
  display:flex;
  align-items:center;
  gap:11px;
}

.payment-icon{
  width:43px;
  height:43px;
  display:flex;
  align-items:center;
  justify-content:center;
  background:#f8f0f4;
  border-radius:14px;
  font-size:20px;
}

.payment-name{
  font-weight:700;
}

.payment-amount{
  font-weight:850;
  direction:ltr;
}

.payment-total{
  display:flex;
  justify-content:space-between;
  margin-top:15px;
  padding-top:15px;
  border-top:2px solid #f1e5eb;
  font-weight:850;
}

/* EXPENSES */

.expense{
  padding:14px 0;
  border-bottom:1px solid #f1e8ed;
}

.expense:last-child{
  border-bottom:0;
}

.expense-main{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.expense-info{
  display:flex;
  gap:11px;
  align-items:center;
  min-width:0;
}

.expense-icon{
  width:40px;
  height:40px;
  background:var(--pink-light);
  border-radius:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  flex-shrink:0;
}

.expense-text{
  min-width:0;
}

.expense-name{
  font-weight:700;
  overflow:hidden;
  text-overflow:ellipsis;
}

.expense-date{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

.expense-payment{
  color:var(--muted);
  font-size:11px;
  margin-top:2px;
}

.expense-amount{
  font-weight:800;
  direction:ltr;
  white-space:nowrap;
}

.actions{
  display:flex;
  gap:7px;
  margin-top:9px;
}

.small-button{
  border:0;
  border-radius:10px;
  padding:7px 11px;
  background:#f7eef3;
  color:var(--text);
  font-size:12px;
}

.delete{
  color:var(--danger);
}

/* FIXED */

.fixed-item{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:13px 0;
  border-bottom:1px solid #f1e8ed;
}

.fixed-item:last-child{
  border-bottom:0;
}

.fixed-name{
  font-weight:700;
}

.fixed-meta{
  color:var(--muted);
  font-size:12px;
  margin-top:3px;
}

/* BUTTONS */

.add-category{
  width:100%;
  border:2px dashed #e9c7d8;
  background:#fffafd;
  color:var(--pink);
  padding:13px;
  border-radius:15px;
  font-weight:750;
  margin-top:12px;
}

.bottom-button{
  position:fixed;
  bottom:17px;
  left:50%;
  transform:translateX(-50%);
  width:calc(100% - 32px);
  max-width:588px;
  border:0;
  border-radius:19px;
  padding:17px;
  background:var(--pink);
  color:white;
  font-size:17px;
  font-weight:850;
  box-shadow:0 9px 25px rgba(216,91,145,.3);
  z-index:5;
}

/* MODALS */

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(45,30,40,.38);
  z-index:10;
  align-items:flex-end;
  justify-content:center;
}

.modal.show{
  display:flex;
}

.sheet{
  background:white;
  width:100%;
  max-width:620px;
  border-radius:27px 27px 0 0;
  padding:22px 18px 30px;
  max-height:90vh;
  overflow:auto;
}

.sheet-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:18px;
}

.sheet-header h2{
  margin:0;
}

.close{
  border:0;
  background:#f6edf2;
  width:40px;
  height:40px;
  border-radius:13px;
}

label{
  display:block;
  font-size:14px;
  font-weight:750;
  margin:12px 0 7px;
}

input,select{
  width:100%;
  padding:14px;
  border:1px solid var(--border);
  border-radius:14px;
  background:#fffafb;
  outline:none;
}

input:focus,select:focus{
  border-color:#dca0bb;
}

.checkbox{
  display:flex;
  align-items:center;
  gap:9px;
  margin:15px 0;
  font-size:14px;
}

.checkbox input{
  width:19px;
  height:19px;
}

.primary{
  width:100%;
  border:0;
  background:var(--text);
  color:white;
  padding:15px;
  border-radius:15px;
  font-weight:800;
  margin-top:10px;
}

.secondary{
  width:100%;
  border:0;
  background:var(--pink-light);
  color:var(--pink-dark);
  padding:14px;
  border-radius:15px;
  font-weight:750;
  margin-top:9px;
}

.empty{
  text-align:center;
  color:var(--muted);
  padding:18px 5px;
}

.hidden{
  display:none!important;
}

@media(max-width:380px){
  h1{font-size:26px}
  .total{font-size:34px}
  .progress{width:90px}
}
</style>
</head>

<body>

<div class="app">

<header>
  <div>
    <h1>הכסף שלי 💕</h1>
    <div class="subtitle">ניהול ההוצאות שלי</div>
  </div>

  <button class="icon-button" onclick="openFixed()">🔄</button>
</header>

<!-- MONTH -->

<section class="month-card">

  <button class="month-arrow" onclick="changeMonth(-1)">‹</button>

  <div class="month-center">
    <div class="month-title" id="monthTitle"></div>
    <div class="month-subtitle" id="monthSubtitle"></div>
    <button class="today-button" onclick="goToCurrentMonth()">
      חזרה לחודש הנוכחי
    </button>
  </div>

  <button class="month-arrow" onclick="changeMonth(1)">›</button>

</section>

<!-- SUMMARY -->

<section class="card summary">

  <div class="summary-label">הוצאתי בחודש הנבחר</div>

  <div class="total" id="total">₪0</div>

  <div class="period" id="periodText"></div>

  <div class="stats">

    <div class="stat">
      <div class="stat-title">מספר הוצאות</div>
      <div class="stat-value" id="expenseCount">0</div>
    </div>

    <div class="stat">
      <div class="stat-title">הוצאה ממוצעת</div>
      <div class="stat-value" id="average">₪0</div>
    </div>

  </div>

</section>

<!-- CATEGORIES -->

<section class="card">

  <h2 class="section-title">לפי קטגוריה</h2>

  <div id="categories"></div>

  <button class="add-category" onclick="openCategoryModal()">
    ＋ הוספת קטגוריה
  </button>

</section>

<!-- PAYMENT -->

<section class="card">

  <h2 class="section-title">איך שילמתי 💳</h2>

  <div id="payments"></div>

  <div class="payment-total">
    <span>סה״כ</span>
    <span id="paymentTotal">₪0</span>
  </div>

</section>

<!-- EXPENSES -->

<section class="card">

  <h2 class="section-title">הוצאות בחודש הזה</h2>

  <div id="expenses"></div>

</section>

</div>

<button class="bottom-button" onclick="openExpense()">
  ＋ הוספת הוצאה
</button>


<!-- EXPENSE MODAL -->

<div class="modal" id="expenseModal">

  <div class="sheet">

    <div class="sheet-header">
      <h2 id="expenseTitle">הוספת הוצאה</h2>
      <button class="close" onclick="closeModal('expenseModal')">✕</button>
    </div>

    <label>סכום</label>
    <input
      id="amount"
      type="number"
      inputmode="decimal"
      placeholder="לדוגמה 50"
    >

    <label>קטגוריה</label>
    <select id="category"></select>

    <label>איך שילמת?</label>

    <select id="payment">
      <option value="visa">💳 ויזה</option>
      <option value="direct">🟣 דיירקט</option>
      <option value="cash">💵 מזומן</option>
    </select>

    <label>מה קנית?</label>

    <input
      id="description"
      type="text"
      placeholder="לדוגמה: קפה ועוגה"
    >

    <label>תאריך</label>

    <input id="date" type="date">

    <div class="checkbox">

      <input
        id="isFixed"
        type="checkbox"
        onchange="toggleFixedFields()"
      >

      <span>הוצאה קבועה / חוזרת</span>

    </div>

    <div id="fixedFields" class="hidden">

      <label>תדירות</label>

      <select id="frequency">
        <option value="monthly">כל חודש</option>
        <option value="quarterly">כל 3 חודשים</option>
        <option value="yearly">פעם בשנה</option>
      </select>

    </div>

    <button class="primary" onclick="saveExpense()">
      שמירת הוצאה
    </button>

  </div>

</div>


<!-- CATEGORY MODAL -->

<div class="modal" id="categoryModal">

  <div class="sheet">

    <div class="sheet-header">

      <h2>קטגוריה חדשה</h2>

      <button class="close" onclick="closeModal('categoryModal')">
        ✕
      </button>

    </div>

    <label>שם הקטגוריה</label>

    <input
      id="newCategory"
      type="text"
      placeholder="לדוגמה: לימודים"
    >

    <label>אייקון</label>

    <input
      id="newIcon"
      type="text"
      maxlength="2"
      placeholder="🎓"
    >

    <button class="primary" onclick="saveCategory()">
      הוספת קטגוריה
    </button>

  </div>

</div>


<!-- FIXED EXPENSES MODAL -->

<div class="modal" id="fixedModal">

  <div class="sheet">

    <div class="sheet-header">

      <h2>הוצאות קבועות 🔄</h2>

      <button class="close" onclick="closeModal('fixedModal')">
        ✕
      </button>

    </div>

    <div id="fixedList"></div>

  </div>

</div>


<script>

const defaultCategories = [

  {name:"אוכל בחוץ",icon:"🍔"},
  {name:"אחזקת רכב",icon:"🚗"},
  {name:"אחר",icon:"📦"},
  {name:"בגדים ואביזרים",icon:"👗"},
  {name:"בתי קפה",icon:"☕"},
  {name:"מנויים ושירותים",icon:"📱"},
  {name:"תחבורה",icon:"🚕"},
  {name:"טיפוח",icon:"💅"},
  {name:"הופעות ואירועים",icon:"🎵"}

];

const payments = [

  {id:"visa",name:"ויזה",icon:"💳"},
  {id:"direct",name:"דיירקט",icon:"🟣"},
  {id:"cash",name:"מזומן",icon:"💵"}

];

let categories =
  JSON.parse(localStorage.getItem("moneyCategories"))
  || defaultCategories;

let expenses =
  JSON.parse(localStorage.getItem("moneyExpenses"))
  || [];

let fixedExpenses =
  JSON.parse(localStorage.getItem("moneyFixed"))
  || [];

let selectedOffset = 0;

let editingId = null;


/* STORAGE */

function saveData(){

  localStorage.setItem(
    "moneyCategories",
    JSON.stringify(categories)
  );

  localStorage.setItem(
    "moneyExpenses",
    JSON.stringify(expenses)
  );

  localStorage.setItem(
    "moneyFixed",
    JSON.stringify(fixedExpenses)
  );

}


/* SORT */

function sortCategories(){

  categories.sort(
    (a,b)=>a.name.localeCompare(b.name,"he")
  );

}


/* MONTH */

function getBaseCycle(){

  const today = new Date();

  let start =
    new Date(
      today.getFullYear(),
      today.getMonth(),
      10
    );

  if(today.getDate()<10){

    start =
      new Date(
        today.getFullYear(),
        today.getMonth()-1,
        10
      );

  }

  return start;

}


function getCycle(offset=0){

  const base = getBaseCycle();

  const start =
    new Date(
      base.getFullYear(),
      base.getMonth()+offset,
      10
    );

  const end =
    new Date(
      start.getFullYear(),
      start.getMonth()+1,
      9,
      23,
      59,
      59
    );

  return {start,end};

}


function changeMonth(direction){

  selectedOffset += direction;

  render();

}


function goToCurrentMonth(){

  selectedOffset=0;

  render();

}


function dateToString(date){

  const y=date.getFullYear();

  const m=String(
    date.getMonth()+1
  ).padStart(2,"0");

  const d=String(
    date.getDate()
  ).padStart(2,"0");

  return `${y}-${m}-${d}`;

}


function formatDate(date){

  return new Date(
    date+"T12:00:00"
  ).toLocaleDateString(
    "he-IL",
    {
      day:"numeric",
      month:"numeric",
      year:"numeric"
    }
  );

}


function monthName(date){

  return date.toLocaleDateString(
    "he-IL",
    {
      month:"long",
      year:"numeric"
    }
  );

}


/* MONEY */

function formatMoney(value){

  return "₪"+
    Number(value).toLocaleString(
      "he-IL",
      {
        minimumFractionDigits:0,
        maximumFractionDigits:2
      }
    );

}


/* CURRENT MONTH EXPENSES */

function getSelectedExpenses(){

  const cycle=getCycle(selectedOffset);

  return expenses.filter(e=>{

    const date=
      new Date(e.date+"T12:00:00");

    return date>=cycle.start &&
           date<=cycle.end;

  });

}


/* FIXED EXPENSE GENERATION */

function generateFixedExpenses(){

  const cycle=getCycle(selectedOffset);

  fixedExpenses.forEach(f=>{

    const startDate =
      new Date(f.startDate+"T12:00:00");

    if(startDate>cycle.end){
      return;
    }

    let candidate =
      new Date(startDate);

    let months=1;

    if(f.frequency==="quarterly"){
      months=3;
    }

    if(f.frequency==="yearly"){
      months=12;
    }

    while(candidate<cycle.start){

      candidate.setMonth(
        candidate.getMonth()+months
      );

    }

    while(candidate<=cycle.end){

      if(candidate>=startDate){

        const dateString=
          dateToString(candidate);

        const exists=
          expenses.some(e=>
            e.fixedSource===f.id &&
            e.date===dateString
          );

        if(!exists){

          expenses.push({

            id:
              Date.now().toString()+
              Math.random(),

            amount:f.amount,

            category:f.category,

            payment:f.payment,

            description:f.description,

            date:dateString,

            fixed:true,

            fixedSource:f.id,

            frequency:f.frequency

          });

        }

      }

      candidate.setMonth(
        candidate.getMonth()+months
      );

    }

  });

  saveData();

}


/* RENDER */

function render(){

  sortCategories();

  generateFixedExpenses();

  const current=
    getSelectedExpenses();

  const total=
    current.reduce(
      (sum,e)=>
        sum+Number(e.amount),
      0
    );

  renderMonth();

  document.getElementById(
    "total"
  ).textContent=
    formatMoney(total);

  document.getElementById(
    "expenseCount"
  ).textContent=
    current.length;

  document.getElementById(
    "average"
  ).textContent=
    current.length
      ? formatMoney(
          total/current.length
        )
      : "₪0";

  renderCategories(
    current,
    total
  );

  renderPayments(current);

  renderExpenses(current);

  renderCategorySelect();

  renderFixed();

  saveData();

}


/* MONTH UI */

function renderMonth(){

  const cycle=
    getCycle(selectedOffset);

  document.getElementById(
    "monthTitle"
  ).textContent=
    monthName(cycle.start);

  document.getElementById(
    "monthSubtitle"
  ).textContent=
    formatDate(
      dateToString(cycle.start)
    )+
    " – "+
    formatDate(
      dateToString(cycle.end)
    );

  document.getElementById(
    "periodText"
  ).textContent=
    "מחזור "+
    formatDate(
      dateToString(cycle.start)
    )+
    " – "+
    formatDate(
      dateToString(cycle.end)
    );

}


/* CATEGORIES */

function renderCategories(
  current,
  total
){

  const container=
    document.getElementById(
      "categories"
    );

  if(!categories.length){

    container.innerHTML=
      '<div class="empty">אין עדיין קטגוריות</div>';

    return;

  }

  container.innerHTML=
    categories.map(cat=>{

      const sum=
        current
          .filter(
            e=>e.category===cat.name
          )
          .reduce(
            (s,e)=>
              s+Number(e.amount),
            0
          );

      const percent=
        total
          ? Math.min(
              100,
              (sum/total)*100
            )
          : 0;

      return `

        <div class="category">

          <div class="category-left">

            <div class="category-icon">
              ${cat.icon}
            </div>

            <div>

              <div class="category-name">
                ${escapeHTML(cat.name)}
              </div>

              <div class="progress">
                <div
                  class="progress-bar"
                  style="width:${percent}%"
                ></div>
              </div>

            </div>

          </div>

          <div class="category-amount">
            ${formatMoney(sum)}
          </div>

        </div>

      `;

    }).join("");

}


/* PAYMENTS */

function renderPayments(current){

  const container=
    document.getElementById(
      "payments"
    );

  let total=0;

  container.innerHTML=
    payments.map(p=>{

      const sum=
        current
          .filter(
            e=>e.payment===p.id
          )
          .reduce(
            (s,e)=>
              s+Number(e.amount),
            0
          );

      total+=sum;

      return `

        <div class="payment-row">

          <div class="payment-left">

            <div class="payment-icon">
              ${p.icon}
            </div>

            <div class="payment-name">
              ${p.name}
            </div>

          </div>

          <div class="payment-amount">
            ${formatMoney(sum)}
          </div>

        </div>

      `;

    }).join("");

  document.getElementById(
    "paymentTotal"
  ).textContent=
    formatMoney(total);

}


/* EXPENSES */

function renderExpenses(current){

  const container=
    document.getElementById(
      "expenses"
    );

  const sorted=
    [...current].sort(
      (a,b)=>
        new Date(b.date)-
        new Date(a.date)
    );

  if(!sorted.length){

    container.innerHTML=
      '<div class="empty">עדיין אין הוצאות בחודש הזה 💕</div>';

    return;

  }

  container.innerHTML=
    sorted.map(e=>{

      const cat=
        categories.find(
          c=>c.name===e.category
        );

      const payment=
        payments.find(
          p=>p.id===e.payment
        );

      return `

        <div class="expense">

          <div class="expense-main">

            <div class="expense-info">

              <div class="expense-icon">
                ${cat ? cat.icon : "💸"}
              </div>

              <div class="expense-text">

                <div class="expense-name">
                  ${escapeHTML(
                    e.description ||
                    e.category
                  )}
                </div>

                <div class="expense-date">
                  ${escapeHTML(
                    e.category
                  )}
                  ·
                  ${formatDate(e.date)}
                  ${e.fixed ? " · 🔄 קבועה" : ""}
                </div>

                <div class="expense-payment">
                  ${payment ? payment.icon+" "+payment.name : ""}
                </div>

              </div>

            </div>

            <div class="expense-amount">
              ${formatMoney(e.amount)}
            </div>

          </div>

          <div class="actions">

            <button
              class="small-button"
              onclick="editExpense('${e.id}')"
            >
              ✏️ עריכה
            </button>

            <button
              class="small-button delete"
              onclick="deleteExpense('${e.id}')"
            >
              🗑️ מחיקה
            </button>

          </div>

        </div>

      `;

    }).join("");

}


/* CATEGORY SELECT */

function renderCategorySelect(){

  sortCategories();

  document.getElementById(
    "category"
  ).innerHTML=
    categories.map(c=>
      `<option value="${escapeHTML(c.name)}">
        ${escapeHTML(c.name)}
      </option>`
    ).join("");

}


/* ADD EXPENSE */

function openExpense(){

  editingId=null;

  document.getElementById(
    "expenseTitle"
  ).textContent=
    "הוספת הוצאה";

  document.getElementById(
    "amount"
  ).value="";

  document.getElementById(
    "description"
  ).value="";

  document.getElementById(
    "payment"
  ).value="visa";

  document.getElementById(
    "isFixed"
  ).checked=false;

  const cycle=
    getCycle(selectedOffset);

  let defaultDate=
    new Date();

  if(selectedOffset!==0){
    defaultDate=
      new Date(cycle.start);
  }

  document.getElementById(
    "date"
  ).value=
    dateToString(defaultDate);

  toggleFixedFields();

  document.getElementById(
    "expenseModal"
  ).classList.add("show");

}


/* EDIT */

function editExpense(id){

  const e=
    expenses.find(
      x=>x.id===id
    );

  if(!e)return;

  editingId=id;

  document.getElementById(
    "expenseTitle"
  ).textContent=
    "עריכת הוצאה";

  document.getElementById(
    "amount"
  ).value=e.amount;

  document.getElementById(
    "description"
  ).value=e.description || "";

  document.getElementById(
    "category"
  ).value=e.category;

  document.getElementById(
    "payment"
  ).value=e.payment || "visa";

  document.getElementById(
    "date"
  ).value=e.date;

  document.getElementById(
    "isFixed"
  ).checked=!!e.fixed;

  document.getElementById(
    "frequency"
  ).value=
    e.frequency || "monthly";

  toggleFixedFields();

  document.getElementById(
    "expenseModal"
  ).classList.add("show");

}


/* SAVE EXPENSE */

function saveExpense(){

  const amount=
    Number(
      document.getElementById(
        "amount"
      ).value
    );

  if(!amount || amount<=0){

    alert("נא להזין סכום תקין");

    return;

  }

  const data={

    amount,

    category:
      document.getElementById(
        "category"
      ).value,

    payment:
      document.getElementById(
        "payment"
      ).value,

    description:
      document.getElementById(
        "description"
      ).value.trim(),

    date:
      document.getElementById(
        "date"
      ).value,

    fixed:
      document.getElementById(
        "isFixed"
      ).checked,

    frequency:
      document.getElementById(
        "frequency"
      ).value

  };

  if(!data.date){

    alert("נא לבחור תאריך");

    return;

  }

  if(editingId){

    const index=
      expenses.findIndex(
        e=>e.id===editingId
      );

    if(index!==-1){

      expenses[index]={
        ...expenses[index],
        ...data
      };

    }

  }else{

    const newExpense={

      id:
        Date.now().toString(),

      ...data

    };

    expenses.push(
      newExpense
    );

    if(data.fixed){

      fixedExpenses.push({

        id:
          Date.now().toString()+
          "-fixed",

        amount:data.amount,

        category:data.category,

        payment:data.payment,

        description:data.description,

        startDate:data.date,

        frequency:data.frequency

      });

    }

  }

  saveData();

  closeModal(
    "expenseModal"
  );

  render();

}


/* DELETE */

function deleteExpense(id){

  if(!confirm(
    "למחוק את ההוצאה?"
  )){
    return;
  }

  expenses=
    expenses.filter(
      e=>e.id!==id
    );

  render();

}


/* FIXED EXPENSES */

function renderFixed(){

  const container=
    document.getElementById(
      "fixedList"
    );

  if(!fixedExpenses.length){

    container.innerHTML=
      '<div class="empty">עדיין אין הוצאות קבועות 🔄</div>';

    return;

  }

  container.innerHTML=
    fixedExpenses.map(f=>`

      <div class="fixed-item">

        <div>

          <div class="fixed-name">
            ${escapeHTML(
              f.description ||
              f.category
            )}
          </div>

          <div class="fixed-meta">

            ${escapeHTML(f.category)}
            ·
            ${formatMoney(f.amount)}
            ·
            ${frequencyText(
              f.frequency
            )}

          </div>

        </div>

        <button
          class="small-button delete"
          onclick="deleteFixed('${f.id}')"
        >
          מחיקה
        </button>

      </div>

    `).join("");

}


function openFixed(){

  renderFixed();

  document.getElementById(
    "fixedModal"
  ).classList.add("show");

}


function deleteFixed(id){

  if(!confirm(
    "למחוק את ההוצאה הקבועה?"
  )){
    return;
  }

  fixedExpenses=
    fixedExpenses.filter(
      f=>f.id!==id
    );

  expenses=
    expenses.filter(
      e=>e.fixedSource!==id
    );

  saveData();

  render();

  renderFixed();

}


function frequencyText(frequency){

  if(
    frequency==="quarterly"
  ){
    return "כל 3 חודשים";
  }

  if(
    frequency==="yearly"
  ){
    return "פעם בשנה";
  }

  return "כל חודש";

}


/* FIXED FIELDS */

function toggleFixedFields(){

  const checked=
    document.getElementById(
      "isFixed"
    ).checked;

  document.getElementById(
    "fixedFields"
  )
  .classList.toggle(
    "hidden",
    !checked
  );

}


/* NEW CATEGORY */

function openCategoryModal(){

  document.getElementById(
    "newCategory"
  ).value="";

  document.getElementById(
    "newIcon"
  ).value="";

  document.getElementById(
    "categoryModal"
  ).classList.add("show");

}


function saveCategory(){

  const name=
    document.getElementById(
      "newCategory"
    ).value.trim();

  const icon=
    document.getElementById(
      "newIcon"
    ).value.trim()
    || "💸";

  if(!name){

    alert(
      "נא להכניס שם לקטגוריה"
    );

    return;

  }

  if(
    categories.some(
      c=>c.name===name
    )
  ){

    alert(
      "הקטגוריה כבר קיימת"
    );

    return;

  }

  categories.push({
    name,
    icon
  });

  sortCategories();

  saveData();

  render();

  closeModal(
    "categoryModal"
  );

}


/* MODALS */

function closeModal(id){

  document.getElementById(
    id
  ).classList.remove("show");

}


/* SECURITY */

function escapeHTML(value){

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


/* START */

sortCategories();

generateFixedExpenses();

render();

</script>

</body>
</html>
