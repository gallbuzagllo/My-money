<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f8e8ef">
<title>הכסף שלי 💕</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#fff8fb;
  color:#3d3339;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

.app{
  max-width:650px;
  margin:auto;
  padding:22px 16px 110px;
}

.header{margin-bottom:18px}

h1{
  margin:0;
  font-size:30px;
  font-weight:900;
}

.subtitle{
  margin-top:5px;
  color:#917f89;
  font-size:14px;
}

.card{
  background:#fff;
  border-radius:24px;
  padding:20px;
  margin-bottom:16px;
  box-shadow:0 8px 25px rgba(70,40,55,.07);
}

.balance-card{
  background:linear-gradient(145deg,#fff,#fff0f6);
}

.small-label{
  color:#91818a;
  font-size:14px;
}

.balance{
  font-size:42px;
  font-weight:900;
  color:#d45b91;
  margin:4px 0 18px;
  direction:ltr;
  text-align:right;
}

.button-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
}

button{
  font:inherit;
  cursor:pointer;
}

.main-button{
  border:0;
  border-radius:15px;
  padding:14px 8px;
  background:#d45b91;
  color:white;
  font-weight:800;
}

.main-button.green{background:#5b9d7d}

.secondary-button{
  border:0;
  border-radius:15px;
  padding:14px 8px;
  background:#f8edf2;
  color:#4a3c43;
  font-weight:800;
}

.info{
  margin-top:12px;
  font-size:12px;
  color:#91818a;
}

.month-navigation{
  display:flex;
  align-items:center;
  gap:8px;
}

.arrow{
  width:42px;
  height:42px;
  border:0;
  border-radius:14px;
  background:#f9edf3;
  color:#c14f80;
  font-size:25px;
}

.month-center{
  flex:1;
  text-align:center;
}

.month-title{
  font-size:18px;
  font-weight:850;
}

.month-dates{
  margin-top:3px;
  color:#95858d;
  font-size:12px;
}

.current-button{
  margin-top:7px;
  border:0;
  background:#f7edf2;
  color:#735c67;
  border-radius:10px;
  padding:6px 10px;
  font-size:11px;
}

.section-title{
  margin:0 0 15px;
  font-size:20px;
  font-weight:850;
}

.total{
  font-size:38px;
  font-weight:900;
  color:#d45b91;
}

.money-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:15px;
}

.money-box{
  background:#fff8fb;
  border-radius:17px;
  padding:13px;
}

.money-label{
  color:#92818b;
  font-size:12px;
}

.money-value{
  margin-top:5px;
  font-weight:850;
  direction:ltr;
  text-align:right;
}

.green-text{color:#4d9474}
.red-text{color:#c84e76}

.category-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.category-button{
  border:0;
  background:#fff8fb;
  border-radius:18px;
  padding:15px 10px;
  text-align:right;
  color:#44363e;
}

.category-button:active{
  transform:scale(.97);
}

.category-top{
  display:flex;
  align-items:center;
  gap:9px;
}

.category-icon{
  width:39px;
  height:39px;
  display:flex;
  justify-content:center;
  align-items:center;
  border-radius:13px;
  background:#fceaf2;
  font-size:19px;
}

.category-name{
  font-weight:800;
  font-size:13px;
}

.category-total{
  margin-top:9px;
  font-weight:850;
  direction:ltr;
  text-align:right;
}

.list-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  padding:14px 0;
  border-bottom:1px solid #f0e7eb;
}

.list-row:last-child{border-bottom:0}

.row-left{
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
}

.row-icon{
  width:40px;
  height:40px;
  flex-shrink:0;
  border-radius:13px;
  background:#fceaf2;
  display:flex;
  justify-content:center;
  align-items:center;
}

.row-title{
  font-weight:800;
  font-size:14px;
}

.row-subtitle{
  color:#95858d;
  font-size:11px;
  margin-top:3px;
}

.row-amount{
  font-weight:900;
  direction:ltr;
  white-space:nowrap;
}

.delete-button{
  border:0;
  background:#fff0f3;
  color:#c84e76;
  border-radius:9px;
  padding:6px 9px;
  font-size:11px;
  margin-top:5px;
}

.empty{
  text-align:center;
  color:#95858d;
  padding:15px 5px;
  font-size:14px;
}

.payment-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.payment-box{
  background:#fff8fb;
  border-radius:17px;
  padding:14px 8px;
  text-align:center;
}

.payment-icon{font-size:22px}

.payment-name{
  font-size:12px;
  color:#8e7d86;
  margin-top:5px;
}

.payment-total{
  margin-top:5px;
  font-weight:900;
  direction:ltr;
}

.bottom-buttons{
  position:fixed;
  bottom:15px;
  left:50%;
  transform:translateX(-50%);
  width:calc(100% - 32px);
  max-width:618px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  z-index:10;
}

.bottom-button{
  border:0;
  color:white;
  padding:16px;
  border-radius:19px;
  font-weight:900;
  font-size:16px;
  box-shadow:0 8px 25px rgba(80,45,65,.18);
}

.expense-button{background:#d45b91}
.income-button{background:#5b9d7d}

.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(50,35,45,.42);
  z-index:20;
  align-items:flex-end;
  justify-content:center;
}

.modal.show{display:flex}

.sheet{
  width:100%;
  max-width:650px;
  max-height:90vh;
  overflow-y:auto;
  background:white;
  border-radius:28px 28px 0 0;
  padding:22px 18px 30px;
}

.sheet-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
}

.sheet-header h2{
  margin:0;
  font-size:21px;
}

.close{
  border:0;
  width:40px;
  height:40px;
  border-radius:13px;
  background:#f8edf2;
}

label{
  display:block;
  margin:13px 0 6px;
  font-size:14px;
  font-weight:800;
}

input,select{
  width:100%;
  padding:14px;
  border:1px solid #eadde4;
  border-radius:14px;
  background:#fffafb;
  font:inherit;
  color:#3d3339;
}

.save-button{
  width:100%;
  margin-top:17px;
  padding:15px;
  border:0;
  border-radius:15px;
  background:#3d3339;
  color:white;
  font-weight:900;
}

.category-modal-title{color:#d45b91}

.category-summary{
  background:#fff8fb;
  border-radius:18px;
  padding:16px;
  text-align:center;
  margin:12px 0;
}

.category-summary-number{
  font-size:31px;
  font-weight:900;
  color:#d45b91;
}

.back-button{
  width:100%;
  border:0;
  padding:13px;
  border-radius:14px;
  background:#f8edf2;
  color:#4d3d45;
  font-weight:800;
  margin-bottom:12px;
}

@media(max-width:380px){
  .balance{font-size:36px}
  .category-grid{grid-template-columns:1fr}
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>הכסף שלי 💕</h1>
    <div class="subtitle">המקום הקטן שלי לעשות סדר בכסף</div>
  </div>

  <div class="card balance-card">

    <div class="small-label">כמה כסף יש לי עכשיו</div>

    <div class="balance" id="balance">₪0</div>

    <div class="button-grid">

      <button class="main-button green" onclick="openModal('incomeModal')">
        ＋ הכנסה חד־פעמית
      </button>

      <button class="secondary-button" onclick="openModal('openingModal')">
        🏦 יתרת פתיחה
      </button>

    </div>

    <div class="info" id="balanceInfo">
      עדיין לא הוגדרה יתרת פתיחה
    </div>

  </div>

  <div class="card">

    <div class="month-navigation">

      <button class="arrow" onclick="changeMonth(-1)">‹</button>

      <div class="month-center">

        <div class="month-title" id="monthTitle"></div>

        <div class="month-dates" id="monthDates"></div>

        <button class="current-button" onclick="currentMonth()">
          חזרה לחודש הנוכחי
        </button>

      </div>

      <button class="arrow" onclick="changeMonth(1)">›</button>

    </div>

  </div>

  <div class="card">

    <div class="small-label">סיכום החודש</div>

    <div class="total" id="monthExpenseTotal">₪0</div>

    <div class="money-grid">

      <div class="money-box">
        <div class="money-label">הכנסות</div>
        <div class="money-value green-text" id="monthIncomeTotal">₪0</div>
      </div>

      <div class="money-box">
        <div class="money-label">הוצאות</div>
        <div class="money-value red-text" id="monthExpenseSmall">₪0</div>
      </div>

    </div>

  </div>

  <div class="card">

    <h2 class="section-title">קטגוריות 🗂️</h2>

    <div class="category-grid" id="categories"></div>

  </div>

  <div class="card">

    <h2 class="section-title">הוצאות החודש 🧾</h2>

    <div id="expenses"></div>

  </div>

  <div class="card">

    <h2 class="section-title">הכנסות החודש 💰</h2>

    <div id="incomes"></div>

  </div>

  <div class="card">

    <h2 class="section-title">איך שילמתי 💳</h2>

    <div class="payment-grid" id="payments"></div>

  </div>

</div>

<div class="bottom-buttons">

  <button class="bottom-button income-button" onclick="openModal('incomeModal')">
    ＋ הכנסה
  </button>

  <button class="bottom-button expense-button" onclick="openModal('expenseModal')">
    ＋ הוצאה
  </button>

</div>


<!-- הוצאה -->

<div class="modal" id="expenseModal">

  <div class="sheet">

    <div class="sheet-header">

      <h2>הוספת הוצאה 💸</h2>

      <button class="close" onclick="closeModal('expenseModal')">✕</button>

    </div>

    <label>סכום</label>

    <input id="expenseAmount" type="number" inputmode="decimal" placeholder="לדוגמה 80">

    <label>קטגוריה</label>

    <select id="expenseCategory"></select>

    <label>איך שילמתי?</label>

    <select id="expensePayment">

      <option value="visa">💳 ויזה</option>
      <option value="direct">🟣 דיירקט</option>
      <option value="cash">💵 מזומן</option>

    </select>

    <label>על מה הוצאתי?</label>

    <input id="expenseDescription" type="text" placeholder="לדוגמה: כרטיס להופעה">

    <label>תאריך</label>

    <input id="expenseDate" type="date">

    <button class="save-button" onclick="saveExpense()">
      שמירת הוצאה
    </button>

  </div>

</div>


<!-- הכנסה -->

<div class="modal" id="incomeModal">

  <div class="sheet">

    <div class="sheet-header">

      <h2>הוספת הכנסה חד־פעמית 💰</h2>

      <button class="close" onclick="closeModal('incomeModal')">✕</button>

    </div>

    <label>סכום</label>

    <input id="incomeAmount" type="number" inputmode="decimal" placeholder="לדוגמה 500">

    <label>מאיפה הכסף?</label>

    <input id="incomeDescription" type="text" placeholder="לדוגמה: מתנה / החזר / עבודה">

    <label>תאריך</label>

    <input id="incomeDate" type="date">

    <button class="save-button" onclick="saveIncome()">
      שמירת הכנסה
    </button>

  </div>

</div>


<!-- יתרת פתיחה -->

<div class="modal" id="openingModal">

  <div class="sheet">

    <div class="sheet-header">

      <h2>יתרת פתיחה 🏦</h2>

      <button class="close" onclick="closeModal('openingModal')">✕</button>

    </div>

    <label>כמה כסף יש לך עכשיו כשאת מתחילה?</label>

    <input id="openingAmount" type="number" inputmode="decimal" placeholder="לדוגמה 4500">

    <button class="save-button" onclick="saveOpening()">
      שמירת יתרת פתיחה
    </button>

  </div>

</div>


<!-- קטגוריה -->

<div class="modal" id="categoryModal">

  <div class="sheet">

    <div class="sheet-header">

      <h2 class="category-modal-title" id="categoryModalTitle"></h2>

      <button class="close" onclick="closeModal('categoryModal')">✕</button>

    </div>

    <div class="category-summary">

      <div class="small-label">סך ההוצאות בקטגוריה החודש</div>

      <div class="category-summary-number" id="categoryModalTotal">
        ₪0
      </div>

    </div>

    <div id="categoryExpenses"></div>

    <button class="back-button" onclick="closeModal('categoryModal')">
      חזרה
    </button>

  </div>

</div>


<script>

const categories = [

  {name:"אוכל בחוץ",icon:"🍔"},
  {name:"אחזקת רכב",icon:"🚗"},
  {name:"אחר",icon:"📦"},
  {name:"בגדים ואביזרים",icon:"👗"},
  {name:"בתי קפה",icon:"☕"},
  {name:"הופעות ואירועים",icon:"🎵"},
  {name:"מנויים ושירותים",icon:"📱"},
  {name:"טיפוח",icon:"💅"},
  {name:"תחבורה",icon:"🚕"}

];

const payments = [

  {id:"visa",name:"ויזה",icon:"💳"},
  {id:"direct",name:"דיירקט",icon:"🟣"},
  {id:"cash",name:"מזומן",icon:"💵"}

];


let expenses =
  JSON.parse(
    localStorage.getItem("moneyExpenses")
  ) || [];


let incomes =
  JSON.parse(
    localStorage.getItem("moneyIncomes")
  ) || [];


let openingBalance =
  Number(
    localStorage.getItem("moneyOpeningBalance")
  ) || 0;


let monthOffset = 0;


function saveData(){

  localStorage.setItem(
    "moneyExpenses",
    JSON.stringify(expenses)
  );

  localStorage.setItem(
    "moneyIncomes",
    JSON.stringify(incomes)
  );

  localStorage.setItem(
    "moneyOpeningBalance",
    String(openingBalance)
  );

}


function money(value){

  return "₪" +
    Number(value).toLocaleString(
      "he-IL",
      {maximumFractionDigits:2}
    );

}


function todayString(){

  const d = new Date();

  return d.getFullYear() +
    "-" +
    String(d.getMonth()+1).padStart(2,"0") +
    "-" +
    String(d.getDate()).padStart(2,"0");

}


function formatDate(date){

  return new Date(
    date + "T12:00:00"
  ).toLocaleDateString("he-IL");

}


function getCycle(){

  const now = new Date();

  let start;

  if(now.getDate() >= 10){

    start = new Date(
      now.getFullYear(),
      now.getMonth() + monthOffset,
      10
    );

  }else{

    start = new Date(
      now.getFullYear(),
      now.getMonth() - 1 + monthOffset,
      10
    );

  }

  const end = new Date(
    start.getFullYear(),
    start.getMonth()+1,
    9,
    23,
    59,
    59
  );

  return {start,end};

}


function changeMonth(value){

  monthOffset += value;
  render();

}


function currentMonth(){

  monthOffset = 0;
  render();

}


function inCurrentCycle(date){

  const cycle = getCycle();

  const d = new Date(
    date + "T12:00:00"
  );

  return d >= cycle.start && d <= cycle.end;

}


function currentExpenses(){

  return expenses.filter(
    e => inCurrentCycle(e.date)
  );

}


function currentIncomes(){

  return incomes.filter(
    i => inCurrentCycle(i.date)
  );

}


function getBalance(){

  const totalIncome =
    incomes.reduce(
      (sum,item) =>
        sum + Number(item.amount),
      0
    );

  const totalExpense =
    expenses.reduce(
      (sum,item) =>
        sum + Number(item.amount),
      0
    );

  return openingBalance +
    totalIncome -
    totalExpense;

}


function openModal(id){

  document
    .getElementById(id)
    .classList.add("show");

  if(id === "expenseModal"){

    document
      .getElementById("expenseDate")
      .value = todayString();

  }

  if(id === "incomeModal"){

    document
      .getElementById("incomeDate")
      .value = todayString();

  }

}


function closeModal(id){

  document
    .getElementById(id)
    .classList.remove("show");

}


function saveExpense(){

  const amount =
    Number(
      document
        .getElementById("expenseAmount")
        .value
    );

  const category =
    document
      .getElementById("expenseCategory")
      .value;

  const payment =
    document
      .getElementById("expensePayment")
      .value;

  const description =
    document
      .getElementById("expenseDescription")
      .value
      .trim();

  const date =
    document
      .getElementById("expenseDate")
      .value;

  if(!amount || amount <= 0 || !date){

    alert("צריך למלא סכום ותאריך ❤️");
    return;

  }

  expenses.push({

    id: Date.now(),

    amount: amount,

    category: category,

    payment: payment,

    description: description || "הוצאה",

    date: date

  });

  saveData();

  closeModal("expenseModal");

  document.getElementById("expenseAmount").value = "";
  document.getElementById("expenseDescription").value = "";

  render();

}


function saveIncome(){

  const amount =
    Number(
      document
        .getElementById("incomeAmount")
        .value
    );

  const description =
    document
      .getElementById("incomeDescription")
      .value
      .trim();

  const date =
    document
      .getElementById("incomeDate")
      .value;

  if(!amount || amount <= 0 || !date){

    alert("צריך למלא סכום ותאריך ❤️");
    return;

  }

  incomes.push({

    id: Date.now(),

    amount: amount,

    description: description || "הכנסה",

    date: date

  });

  saveData();

  closeModal("incomeModal");

  document.getElementById("incomeAmount").value = "";
  document.getElementById("incomeDescription").value = "";

  render();

}


function saveOpening(){

  const amount =
    Number(
      document
        .getElementById("openingAmount")
        .value
    );

  if(amount < 0 || isNaN(amount)){

    alert("הכניסי סכום תקין ❤️");
    return;

  }

  openingBalance = amount;

  saveData();

  closeModal("openingModal");

  document.getElementById("openingAmount").value = "";

  render();

}


/* ================================
   מחיקת הוצאה - מתוקנת
================================ */

function deleteExpense(id){

  const expenseId = Number(id);

  const confirmDelete =
    confirm("למחוק את ההוצאה?");

  if(!confirmDelete){
    return;
  }

  const originalLength =
    expenses.length;

  expenses =
    expenses.filter(
      expense =>
        Number(expense.id) !== expenseId
    );

  if(expenses.length === originalLength){

    alert("לא הצלחתי למצוא את ההוצאה למחיקה.");
    return;

  }

  saveData();

  render();

}


/* ================================
   מחיקת הכנסה
================================ */

function deleteIncome(id){

  const incomeId = Number(id);

  const confirmDelete =
    confirm("למחוק את ההכנסה?");

  if(!confirmDelete){
    return;
  }

  incomes =
    incomes.filter(
      income =>
        Number(income.id) !== incomeId
    );

  saveData();

  render();

}


function renderCategorySelect(){

  const select =
    document.getElementById(
      "expenseCategory"
    );

  select.innerHTML = "";

  categories.forEach(category => {

    const option =
      document.createElement("option");

    option.value =
      category.name;

    option.textContent =
      category.name;

    select.appendChild(option);

  });

}


function renderCategories(){

  const container =
    document.getElementById(
      "categories"
    );

  container.innerHTML = "";

  const ex = currentExpenses();

  categories
    .slice()
    .sort(
      (a,b) =>
        a.name.localeCompare(b.name,"he")
    )
    .forEach(category => {

      const total =
        ex
          .filter(
            e =>
              e.category ===
              category.name
          )
          .reduce(
            (sum,e) =>
              sum + Number(e.amount),
            0
          );

      const button =
        document.createElement("button");

      button.className =
        "category-button";

      button.onclick =
        () =>
          openCategory(category.name);

      button.innerHTML = `

        <div class="category-top">

          <div class="category-icon">
            ${category.icon}
          </div>

          <div class="category-name">
            ${category.name}
          </div>

        </div>

        <div class="category-total">
          ${money(total)}
        </div>

      `;

      container.appendChild(button);

    });

}


function openCategory(categoryName){

  const category =
    categories.find(
      c =>
        c.name === categoryName
    );

  const categoryExpenses =
    currentExpenses()
      .filter(
        e =>
          e.category === categoryName
      );

  const total =
    categoryExpenses
      .reduce(
        (sum,e) =>
          sum + Number(e.amount),
        0
      );

  document
    .getElementById(
      "categoryModalTitle"
    )
    .textContent =
      category.icon +
      " " +
      category.name;

  document
    .getElementById(
      "categoryModalTotal"
    )
    .textContent =
      money(total);

  const container =
    document.getElementById(
      "categoryExpenses"
    );

  container.innerHTML = "";

  if(categoryExpenses.length === 0){

    container.innerHTML = `
      <div class="empty">
        אין עדיין הוצאות בקטגוריה הזאת בחודש הזה 💕
      </div>
    `;

  }else{

    categoryExpenses
      .slice()
      .sort(
        (a,b) =>
          new Date(b.date) -
          new Date(a.date)
      )
      .forEach(expense => {

        const payment =
          payments.find(
            p =>
              p.id === expense.payment
          );

        const row =
          document.createElement("div");

        row.className = "list-row";

        row.innerHTML = `

          <div class="row-left">

            <div class="row-icon">
              ${category.icon}
            </div>

            <div>

              <div class="row-title">
                ${escapeHtml(expense.description)}
              </div>

              <div class="row-subtitle">
                ${formatDate(expense.date)}
                ·
                ${payment ? payment.name : ""}
              </div>

            </div>

          </div>

          <div>

            <div class="row-amount">
              ${money(expense.amount)}
            </div>

            <button
              class="delete-button"
              onclick="deleteExpense(${Number(expense.id)}); closeModal('categoryModal')"
            >
              מחיקה
            </button>

          </div>

        `;

        container.appendChild(row);

      });

  }

  openModal("categoryModal");

}


function renderExpenses(){

  const container =
    document.getElementById(
      "expenses"
    );

  container.innerHTML = "";

  const ex =
    currentExpenses()
      .slice()
      .sort(
        (a,b) =>
          new Date(b.date) -
          new Date(a.date)
      );

  if(ex.length === 0){

    container.innerHTML = `
      <div class="empty">
        עדיין אין הוצאות בחודש הזה 🌸
      </div>
    `;

    return;

  }

  ex.forEach(expense => {

    const category =
      categories.find(
        c =>
          c.name ===
          expense.category
      );

    const payment =
      payments.find(
        p =>
          p.id ===
          expense.payment
      );

    const row =
      document.createElement("div");

    row.className =
      "list-row";

    row.innerHTML = `

      <div class="row-left">

        <div class="row-icon">
          ${category ? category.icon : "📦"}
        </div>

        <div>

          <div class="row-title">
            ${escapeHtml(expense.description)}
          </div>

          <div class="row-subtitle">

            ${category ? category.name : ""}

            ·

            ${formatDate(expense.date)}

            ·

            ${payment ? payment.name : ""}

          </div>

        </div>

      </div>

      <div>

        <div class="row-amount">
          ${money(expense.amount)}
        </div>

        <button
          class="delete-button"
          type="button"
          onclick="deleteExpense(${Number(expense.id)})"
        >
          מחיקה
        </button>

      </div>

    `;

    container.appendChild(row);

  });

}


function renderIncomes(){

  const container =
    document.getElementById(
      "incomes"
    );

  container.innerHTML = "";

  const inc =
    currentIncomes()
      .slice()
      .sort(
        (a,b) =>
          new Date(b.date) -
          new Date(a.date)
      );

  if(inc.length === 0){

    container.innerHTML = `
      <div class="empty">
        אין הכנסות בחודש הזה
      </div>
    `;

    return;

  }

  inc.forEach(income => {

    const row =
      document.createElement("div");

    row.className =
      "list-row";

    row.innerHTML = `

      <div class="row-left">

        <div class="row-icon">
          💰
        </div>

        <div>

          <div class="row-title">
            ${escapeHtml(income.description)}
          </div>

          <div class="row-subtitle">
            ${formatDate(income.date)}
          </div>

        </div>

      </div>

      <div>

        <div class="row-amount green-text">
          +${money(income.amount)}
        </div>

        <button
          class="delete-button"
          type="button"
          onclick="deleteIncome(${Number(income.id)})"
        >
          מחיקה
        </button>

      </div>

    `;

    container.appendChild(row);

  });

}


function renderPayments(){

  const container =
    document.getElementById(
      "payments"
    );

  container.innerHTML = "";

  const ex =
    currentExpenses();

  payments.forEach(payment => {

    const total =
      ex
        .filter(
          e =>
            e.payment ===
            payment.id
        )
        .reduce(
          (sum,e) =>
            sum + Number(e.amount),
          0
        );

    const box =
      document.createElement("div");

    box.className =
      "payment-box";

    box.innerHTML = `

      <div class="payment-icon">
        ${payment.icon}
      </div>

      <div class="payment-name">
        ${payment.name}
      </div>

      <div class="payment-total">
        ${money(total)}
      </div>

    `;

    container.appendChild(box);

  });

}


function escapeHtml(text){

  return String(text)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function render(){

  const ex =
    currentExpenses();

  const inc =
    currentIncomes();

  const expenseTotal =
    ex.reduce(
      (sum,e) =>
        sum + Number(e.amount),
      0
    );

  const incomeTotal =
    inc.reduce(
      (sum,i) =>
        sum + Number(i.amount),
      0
    );

  const cycle =
    getCycle();

  document
    .getElementById("balance")
    .textContent =
      money(getBalance());

  document
    .getElementById("balanceInfo")
    .textContent =
      openingBalance
        ? "יתרת פתיחה: " +
          money(openingBalance) +
          " · היתרה מתעדכנת אוטומטית"
        : "הגדירי יתרת פתיחה כדי להתחיל 💕";

  document
    .getElementById("monthTitle")
    .textContent =
      cycle.start.toLocaleDateString(
        "he-IL",
        {
          month:"long",
          year:"numeric"
        }
      );

  document
    .getElementById("monthDates")
    .textContent =
      cycle.start.toLocaleDateString("he-IL") +
      " – " +
      cycle.end.toLocaleDateString("he-IL");

  document
    .getElementById("monthExpenseTotal")
    .textContent =
      money(expenseTotal);

  document
    .getElementById("monthIncomeTotal")
    .textContent =
      money(incomeTotal);

  document
    .getElementById("monthExpenseSmall")
    .textContent =
      money(expenseTotal);

  renderCategorySelect();
  renderCategories();
  renderExpenses();
  renderIncomes();
  renderPayments();

}


document.addEventListener(
  "DOMContentLoaded",
  function(){

    render();

  }
);


document.addEventListener(
  "click",
  function(event){

    if(
      event.target.classList.contains("modal")
    ){

      event.target.classList.remove("show");

    }

  }
);

</script>

</body>
</html>
