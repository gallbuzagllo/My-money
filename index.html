<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>הכסף שלי 💕</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

body{
  margin:0;
  background:#fff8fb;
  color:#3f3740;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;
}

button,input,select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:820px;
  margin:auto;
  padding:20px 18px 120px;
}

/* HEADER */
.header{
  text-align:center;
  padding:10px 0 22px;
}

.header h1{
  margin:0;
  font-size:34px;
  font-weight:900;
}

.header p{
  margin:6px 0 0;
  color:#a48f9c;
  font-size:15px;
}

/* BALANCE */
.balance-card{
  background:#fff;
  border-radius:30px;
  padding:25px 22px;
  box-shadow:0 8px 30px rgba(150,100,125,.08);
  margin-bottom:18px;
  text-align:center;
}

.balance-label{
  color:#a48f9c;
  font-size:16px;
}

.balance{
  font-size:42px;
  font-weight:900;
  margin:5px 0 8px;
}

.balance-sub{
  color:#b39da9;
  font-size:14px;
}

/* PERIOD */
.period-card{
  background:#fff;
  border-radius:25px;
  padding:14px 18px;
  margin-bottom:18px;
  box-shadow:0 8px 30px rgba(150,100,125,.06);
}

.period-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.period-title{
  font-weight:800;
  font-size:15px;
}

.period-dates{
  color:#a48f9c;
  font-size:14px;
}

.period-edit{
  border:0;
  background:#fff0f6;
  color:#cf5a8d;
  border-radius:12px;
  padding:7px 11px;
  font-size:13px;
}

/* SUMMARY */
.summary{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-bottom:20px;
}

.summary-card{
  background:#fff;
  border-radius:25px;
  padding:20px 15px;
  text-align:center;
  box-shadow:0 8px 30px rgba(150,100,125,.06);
}

.summary-title{
  color:#a48f9c;
  font-size:14px;
}

.summary-value{
  font-size:27px;
  font-weight:900;
  margin-top:5px;
}

.income-value{
  color:#55a17f;
}

.expense-value{
  color:#d4568c;
}

/* SECTION */
.section{
  background:#fff;
  border-radius:30px;
  padding:22px 18px;
  margin-bottom:20px;
  box-shadow:0 8px 30px rgba(150,100,125,.07);
}

.section-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:17px;
}

.section-title{
  margin:0;
  font-size:26px;
  font-weight:900;
}

/* CATEGORIES */
.categories{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}

.category-card{
  background:#fff7fb;
  border-radius:24px;
  padding:17px 14px;
  min-height:120px;
  border:1px solid #f8e8ef;
  transition:.15s;
}

.category-card:active{
  transform:scale(.98);
}

.category-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.category-icon{
  width:52px;
  height:52px;
  border-radius:18px;
  background:#fdebf3;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:27px;
}

.category-name{
  font-size:18px;
  font-weight:800;
  text-align:right;
}

.category-total{
  margin-top:13px;
  font-size:22px;
  font-weight:900;
}

.category-goal{
  margin-top:3px;
  color:#a996a1;
  font-size:12px;
}

/* SORT */
.sort-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:12px;
  gap:10px;
}

.sort-label{
  color:#a18e99;
  font-size:15px;
}

.sort-select{
  direction:rtl;
  border:2px solid #efdbe5;
  background:#fffafd;
  color:#554850;
  border-radius:18px;
  padding:9px 12px;
  min-width:205px;
  outline:none;
}

/* EXPENSE */
.expense-item,
.income-item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:15px 0;
  border-bottom:1px solid #f0e5ea;
}

.expense-item:last-child,
.income-item:last-child{
  border-bottom:0;
}

.expense-icon,
.income-icon{
  flex:0 0 55px;
  width:55px;
  height:55px;
  border-radius:18px;
  background:#fdebf3;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
}

.expense-info,
.income-info{
  flex:1;
  min-width:0;
}

.expense-name,
.income-name{
  font-size:19px;
  font-weight:850;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.expense-meta,
.income-meta{
  color:#a28f9a;
  font-size:14px;
  margin-top:3px;
}

.expense-right,
.income-right{
  text-align:left;
  min-width:90px;
}

.expense-amount{
  font-size:21px;
  font-weight:900;
}

.income-amount{
  font-size:21px;
  font-weight:900;
  color:#55a17f;
}

/* ACTIONS */
.item-actions{
  display:flex;
  align-items:center;
  justify-content:flex-start;
  gap:8px;
  margin-top:7px;
}

.edit-btn{
  border:0;
  background:transparent;
  color:#d18aa8;
  padding:2px 3px;
  font-size:16px;
  line-height:1;
  min-width:24px;
}

.delete-btn{
  border:0;
  background:transparent;
  color:#d18aa8;
  padding:2px 0;
  font-size:13px;
}

/* PAYMENT SUMMARY */
.payment-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.payment-card{
  background:#fff7fb;
  border-radius:20px;
  padding:15px;
  text-align:center;
}

.payment-icon{
  font-size:27px;
}

.payment-name{
  font-weight:800;
  margin-top:4px;
}

.payment-total{
  font-size:19px;
  font-weight:900;
  margin-top:4px;
}

/* BUTTONS */
.bottom-buttons{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  max-width:820px;
  margin:auto;
  padding:12px 18px calc(12px + env(safe-area-inset-bottom));
  background:rgba(255,248,251,.95);
  backdrop-filter:blur(12px);
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  z-index:50;
}

.main-btn{
  border:0;
  border-radius:25px;
  padding:18px 10px;
  color:#fff;
  font-size:23px;
  font-weight:900;
  box-shadow:0 7px 18px rgba(150,100,125,.15);
}

.expense-btn{
  background:#d4568c;
}

.income-btn{
  background:#59a381;
}

/* MODAL */
.modal-bg{
  position:fixed;
  inset:0;
  background:rgba(55,40,50,.35);
  display:none;
  align-items:flex-end;
  justify-content:center;
  z-index:100;
  padding:0;
}

.modal-bg.show{
  display:flex;
}

.modal{
  width:100%;
  max-width:820px;
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:32px 32px 0 0;
  padding:24px 20px 35px;
}

.modal-header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:20px;
}

.modal-title{
  font-size:27px;
  font-weight:900;
}

.close-btn{
  border:0;
  background:#fff0f5;
  color:#b97894;
  width:38px;
  height:38px;
  border-radius:50%;
  font-size:20px;
}

/* FORM */
.form-group{
  margin-bottom:14px;
}

.form-label{
  display:block;
  margin-bottom:6px;
  font-weight:750;
  color:#685b63;
}

.form-input,
.form-select{
  width:100%;
  border:2px solid #f0dfe7;
  border-radius:17px;
  background:#fffafd;
  padding:13px 14px;
  outline:none;
  color:#40383e;
}

.form-input:focus,
.form-select:focus{
  border-color:#db91ae;
}

.payment-options{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
}

.payment-option{
  border:2px solid #f0dfe7;
  background:#fffafd;
  border-radius:18px;
  padding:12px 8px;
  text-align:center;
  color:#574b52;
}

.payment-option.selected{
  border-color:#d4568c;
  background:#fff0f6;
}

.payment-option-icon{
  display:block;
  font-size:25px;
  margin-bottom:3px;
}

.save-btn{
  width:100%;
  border:0;
  border-radius:21px;
  background:#d4568c;
  color:white;
  padding:16px;
  font-size:19px;
  font-weight:900;
  margin-top:8px;
}

/* EMPTY */
.empty{
  text-align:center;
  color:#ad9ba4;
  padding:25px 5px;
}

/* CATEGORY MODAL */
.category-total-big{
  background:#fff5f9;
  border-radius:22px;
  padding:18px;
  text-align:center;
  margin-bottom:15px;
}

.category-total-big div:first-child{
  color:#a58e9a;
  font-size:14px;
}

.category-total-big div:last-child{
  font-size:30px;
  font-weight:900;
  margin-top:4px;
}

/* DREAMS */
.dream{
  background:#fff7fb;
  border-radius:22px;
  padding:16px;
  margin-bottom:10px;
}

.dream-head{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.dream-name{
  font-weight:900;
  font-size:19px;
}

.dream-progress{
  height:10px;
  border-radius:20px;
  background:#f0e4e9;
  margin:12px 0 7px;
  overflow:hidden;
}

.dream-progress-fill{
  height:100%;
  background:#d4568c;
  border-radius:20px;
}

.dream-meta{
  color:#9f8c96;
  font-size:13px;
}

/* DESKTOP */
@media(min-width:700px){
  .categories{
    grid-template-columns:repeat(3,1fr);
  }

  .payment-grid{
    grid-template-columns:repeat(4,1fr);
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="header">
    <h1>הכסף שלי 💕</h1>
    <p>מעקב פשוט אחרי הכסף שלי</p>
  </div>

  <div class="balance-card">
    <div class="balance-label">היתרה שלי</div>
    <div class="balance" id="balance">₪0</div>
    <div class="balance-sub" id="balanceSub">היתרה הכוללת</div>
  </div>

  <div class="period-card">
    <div class="period-row">
      <div>
        <div class="period-title">תקופת המעקב</div>
        <div class="period-dates" id="periodText"></div>
      </div>
      <button class="period-edit" onclick="openPeriodModal()">שינוי</button>
    </div>
  </div>

  <div class="summary">
    <div class="summary-card">
      <div class="summary-title">הוצאות בתקופה</div>
      <div class="summary-value expense-value" id="periodExpenses">₪0</div>
    </div>

    <div class="summary-card">
      <div class="summary-title">הכנסות בתקופה</div>
      <div class="summary-value income-value" id="periodIncome">₪0</div>
    </div>
  </div>

  <section class="section">
    <div class="section-header">
      <h2 class="section-title">קטגוריות</h2>
    </div>
    <div class="categories" id="categories"></div>
  </section>

  <section class="section">
    <div class="section-header">
      <h2 class="section-title">הוצאות בתקופה 🧾</h2>
    </div>

    <!-- הסידור נמצא עכשיו בצד ימין -->
    <div class="sort-row">
      <select id="sortSelect" class="sort-select" onchange="changeSort()">
        <option value="new">חדשות → ישנות</option>
        <option value="old">ישנות → חדשות</option>
        <option value="payment">לפי אמצעי תשלום</option>
        <option value="category">לפי קטגוריה</option>
        <option value="low">סכום: נמוך → גבוה</option>
        <option value="high">סכום: גבוה → נמוך</option>
      </select>

      <span class="sort-label">סידור</span>
    </div>

    <div id="expensesList"></div>
  </section>

  <section class="section">
    <div class="section-header">
      <h2 class="section-title">הכנסות בתקופה 💚</h2>
    </div>

    <div id="incomesList"></div>
  </section>

  <section class="section">
    <div class="section-header">
      <h2 class="section-title">אמצעי תשלום</h2>
    </div>

    <div class="payment-grid" id="paymentSummary"></div>
  </section>

</div>

<div class="bottom-buttons">
  <button class="main-btn expense-btn" onclick="openExpenseModal()">+ הוצאה</button>
  <button class="main-btn income-btn" onclick="openIncomeModal()">+ הכנסה</button>
</div>


<!-- EXPENSE MODAL -->
<div class="modal-bg" id="expenseModal">
  <div class="modal">

    <div class="modal-header">
      <div class="modal-title" id="expenseModalTitle">הוספת הוצאה</div>
      <button class="close-btn" onclick="closeModal('expenseModal')">×</button>
    </div>

    <div class="form-group">
      <label class="form-label">סכום</label>
      <input class="form-input" type="number" id="expenseAmount" inputmode="decimal" placeholder="כמה הוצאתי?">
    </div>

    <div class="form-group">
      <label class="form-label">קטגוריה</label>
      <select class="form-select" id="expenseCategory"></select>
    </div>

    <div class="form-group">
      <label class="form-label">אמצעי תשלום</label>

      <div class="payment-options">

        <button type="button" class="payment-option" data-payment="cash" onclick="selectPayment('cash')">
          <span class="payment-option-icon">💸</span>
          מזומן
        </button>

        <button type="button" class="payment-option" data-payment="visa" onclick="selectPayment('visa')">
          <span class="payment-option-icon">💳</span>
          ויזה
        </button>

        <button type="button" class="payment-option" data-payment="direct" onclick="selectPayment('direct')">
          <span class="payment-option-icon">💵</span>
          דיירקט
        </button>

        <button type="button" class="payment-option" data-payment="dad" onclick="selectPayment('dad')">
          <span class="payment-option-icon">🫶🏼</span>
          אבא
        </button>

      </div>
    </div>

    <div class="form-group">
      <label class="form-label">מה קניתי?</label>
      <input class="form-input" id="expenseDescription" placeholder="למשל: קפה עם שיר">
    </div>

    <div class="form-group">
      <label class="form-label">תאריך</label>
      <input class="form-input" type="date" id="expenseDate">
    </div>

    <button class="save-btn" onclick="saveExpense()">שמירה</button>

  </div>
</div>


<!-- INCOME MODAL -->
<div class="modal-bg" id="incomeModal">
  <div class="modal">

    <div class="modal-header">
      <div class="modal-title">הוספת הכנסה</div>
      <button class="close-btn" onclick="closeModal('incomeModal')">×</button>
    </div>

    <div class="form-group">
      <label class="form-label">סכום</label>
      <input class="form-input" type="number" id="incomeAmount" inputmode="decimal">
    </div>

    <div class="form-group">
      <label class="form-label">מקור ההכנסה</label>
      <input class="form-input" id="incomeDescription" placeholder="למשל: משכורת">
    </div>

    <div class="form-group">
      <label class="form-label">תאריך</label>
      <input class="form-input" type="date" id="incomeDate">
    </div>

    <button class="save-btn" style="background:#59a381" onclick="saveIncome()">שמירה</button>

  </div>
</div>


<!-- PERIOD MODAL -->
<div class="modal-bg" id="periodModal">
  <div class="modal">

    <div class="modal-header">
      <div class="modal-title">תקופת המעקב</div>
      <button class="close-btn" onclick="closeModal('periodModal')">×</button>
    </div>

    <div class="form-group">
      <label class="form-label">מתאריך</label>
      <input class="form-input" type="date" id="periodStart">
    </div>

    <div class="form-group">
      <label class="form-label">עד תאריך</label>
      <input class="form-input" type="date" id="periodEnd">
    </div>

    <button class="save-btn" onclick="savePeriod()">שמירה</button>

  </div>
</div>


<!-- CATEGORY MODAL -->
<div class="modal-bg" id="categoryModal">
  <div class="modal">

    <div class="modal-header">
      <div class="modal-title" id="categoryModalTitle">קטגוריה</div>
      <button class="close-btn" onclick="closeModal('categoryModal')">×</button>
    </div>

    <div class="category-total-big">
      <div>סך ההוצאות בקטגוריה בתקופה</div>
      <div id="categoryModalTotal">₪0</div>
    </div>

    <div id="categoryExpenses"></div>

  </div>
</div>


<script>
/* =========================
   DATA
========================= */

const EXPENSE_KEY = "moneyExpenses";
const INCOME_KEY = "moneyIncomes";
const GOALS_KEY = "moneyGoals";
const SORT_KEY = "moneyExpenseSort";
const PERIOD_START_KEY = "moneyPeriodStart";
const PERIOD_END_KEY = "moneyPeriodEnd";
const OPENING_BALANCE_KEY = "moneyOpeningBalance";
const DREAMS_KEY = "moneyDreams";

const categories = [
  {id:"food", name:"אוכל בחוץ", icon:"🍔"},
  {id:"car", name:"אחזקת רכב", icon:"🚗"},
  {id:"other", name:"אחר", icon:"📦"},
  {id:"clothes", name:"בגדים ואביזרים", icon:"👗"},
  {id:"coffee", name:"בתי קפה", icon:"☕"},
  {id:"events", name:"הופעות ואירועים", icon:"🎵"},
  {id:"subscriptions", name:"מנויים ושירותים", icon:"📱"},
  {id:"beauty", name:"טיפוח", icon:"💅"},
  {id:"transport", name:"תחבורה", icon:"🚕"}
];

const payments = {
  cash:{name:"מזומן",icon:"💸"},
  visa:{name:"ויזה",icon:"💳"},
  direct:{name:"דיירקט",icon:"💵"},
  dad:{name:"אבא",icon:"🫶🏼"}
};

let expenses = loadArray(EXPENSE_KEY);
let incomes = loadArray(INCOME_KEY);
let goals = loadObject(GOALS_KEY);
let dreams = loadArray(DREAMS_KEY);

let editingExpenseId = null;
let selectedPayment = "visa";


/* =========================
   HELPERS
========================= */

function loadArray(key){
  try{
    const value = JSON.parse(localStorage.getItem(key));
    return Array.isArray(value) ? value : [];
  }catch(e){
    return [];
  }
}

function loadObject(key){
  try{
    const value = JSON.parse(localStorage.getItem(key));
    return value && typeof value === "object" && !Array.isArray(value) ? value : {};
  }catch(e){
    return {};
  }
}

function saveData(){
  localStorage.setItem(EXPENSE_KEY,JSON.stringify(expenses));
  localStorage.setItem(INCOME_KEY,JSON.stringify(incomes));
  localStorage.setItem(GOALS_KEY,JSON.stringify(goals));
  localStorage.setItem(DREAMS_KEY,JSON.stringify(dreams));
}

function money(value){
  return "₪" + Number(value || 0).toLocaleString("he-IL");
}

function getCategory(id){
  return categories.find(c => c.id === id) || {
    id:"other",
    name:"אחר",
    icon:"📦"
  };
}

function getPayment(id){
  return payments[id] || payments.visa;
}

function dateValue(date){
  if(!date) return 0;
  return new Date(date + "T00:00:00").getTime();
}

function formatDate(date){
  if(!date) return "";
  const parts = date.split("-");
  return `${parts[2]}.${parts[1]}.${parts[0]}`;
}

function today(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth()+1).padStart(2,"0");
  const day = String(d.getDate()).padStart(2,"0");
  return `${y}-${m}-${day}`;
}


/* =========================
   PERIOD
========================= */

function defaultPeriod(){
  const now = new Date();

  let year = now.getFullYear();
  let month = now.getMonth();

  if(now.getDate() < 10){
    month--;
  }

  const start = new Date(year,month,10);

  const end = new Date(start.getFullYear(),start.getMonth()+1,9);

  return {
    start:toDateInput(start),
    end:toDateInput(end)
  };
}

function toDateInput(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}

function getPeriod(){
  let start = localStorage.getItem(PERIOD_START_KEY);
  let end = localStorage.getItem(PERIOD_END_KEY);

  if(!start || !end){
    const p = defaultPeriod();

    start = p.start;
    end = p.end;

    localStorage.setItem(PERIOD_START_KEY,start);
    localStorage.setItem(PERIOD_END_KEY,end);
  }

  return {start,end};
}

function inPeriod(date){
  const p = getPeriod();
  return date >= p.start && date <= p.end;
}

function openPeriodModal(){
  const p = getPeriod();

  document.getElementById("periodStart").value = p.start;
  document.getElementById("periodEnd").value = p.end;

  openModal("periodModal");
}

function savePeriod(){
  const start = document.getElementById("periodStart").value;
  const end = document.getElementById("periodEnd").value;

  if(!start || !end){
    alert("בחרי תאריך התחלה וסיום");
    return;
  }

  if(start > end){
    alert("תאריך ההתחלה חייב להיות לפני תאריך הסיום");
    return;
  }

  localStorage.setItem(PERIOD_START_KEY,start);
  localStorage.setItem(PERIOD_END_KEY,end);

  closeModal("periodModal");
  render();
}


/* =========================
   RENDER
========================= */

function render(){
  renderPeriod();
  renderBalance();
  renderSummary();
  renderCategories();
  renderExpenses();
  renderIncomes();
  renderPaymentSummary();

  const savedSort = localStorage.getItem(SORT_KEY) || "new";
  document.getElementById("sortSelect").value = savedSort;
}

function renderPeriod(){
  const p = getPeriod();

  document.getElementById("periodText").textContent =
    `${formatDate(p.start)} – ${formatDate(p.end)}`;
}

function renderBalance(){
  const opening = Number(localStorage.getItem(OPENING_BALANCE_KEY) || 0);

  const totalIncome = incomes.reduce((sum,i)=>sum + Number(i.amount || 0),0);
  const totalExpense = expenses.reduce((sum,e)=>sum + Number(e.amount || 0),0);

  const balance = opening + totalIncome - totalExpense;

  document.getElementById("balance").textContent = money(balance);

  document.getElementById("balanceSub").textContent =
    opening
      ? `כולל יתרת פתיחה של ${money(opening)}`
      : "היתרה הכוללת";
}

function renderSummary(){
  const periodExpenses = expenses
    .filter(e=>inPeriod(e.date))
    .reduce((sum,e)=>sum + Number(e.amount || 0),0);

  const periodIncome = incomes
    .filter(i=>inPeriod(i.date))
    .reduce((sum,i)=>sum + Number(i.amount || 0),0);

  document.getElementById("periodExpenses").textContent = money(periodExpenses);
  document.getElementById("periodIncome").textContent = money(periodIncome);
}


/* =========================
   CATEGORIES
========================= */

function renderCategories(){
  const container = document.getElementById("categories");

  container.innerHTML = categories.map(cat=>{

    const total = expenses
      .filter(e=>e.category === cat.id && inPeriod(e.date))
      .reduce((sum,e)=>sum + Number(e.amount || 0),0);

    const goal = Number(goals[cat.id] || 0);

    return `
      <button class="category-card" onclick="openCategory('${cat.id}')">
        <div class="category-top">
          <div class="category-name">${cat.name}</div>
          <div class="category-icon">${cat.icon}</div>
        </div>

        <div class="category-total">${money(total)}</div>

        ${
          goal
          ? `<div class="category-goal">יעד: ${money(goal)} בתקופת המעקב</div>`
          : `<div class="category-goal">לחצי כדי להגדיר סכום רצוי</div>`
        }
      </button>
    `;
  }).join("");
}


/* =========================
   EXPENSES
========================= */

function renderExpenses(){
  let list = expenses.filter(e=>inPeriod(e.date));

  const sort = localStorage.getItem(SORT_KEY) || "new";

  if(sort === "new"){
    list.sort((a,b)=>dateValue(b.date)-dateValue(a.date));
  }

  if(sort === "old"){
    list.sort((a,b)=>dateValue(a.date)-dateValue(b.date));
  }

  if(sort === "low"){
    list.sort((a,b)=>Number(a.amount)-Number(b.amount));
  }

  if(sort === "high"){
    list.sort((a,b)=>Number(b.amount)-Number(a.amount));
  }

  if(sort === "category"){
    list.sort((a,b)=>{
      const ca = getCategory(a.category).name;
      const cb = getCategory(b.category).name;
      return ca.localeCompare(cb,"he");
    });
  }

  if(sort === "payment"){
    list.sort((a,b)=>{
      const pa = getPayment(a.payment).name;
      const pb = getPayment(b.payment).name;
      return pa.localeCompare(pb,"he");
    });
  }

  const container = document.getElementById("expensesList");

  if(!list.length){
    container.innerHTML = `<div class="empty">אין הוצאות בתקופה הזו 💕</div>`;
    return;
  }

  container.innerHTML = list.map(e=>{

    const cat = getCategory(e.category);
    const pay = getPayment(e.payment);

    return `
      <div class="expense-item">

        <div class="expense-icon">${cat.icon}</div>

        <div class="expense-info">

          <div class="expense-name">
            ${escapeHtml(e.description || cat.name)}
          </div>

          <div class="expense-meta">
            ${formatDate(e.date)}
            ·
            ${pay.name} ${pay.icon}
            ·
            ${cat.name}
          </div>

          <div class="item-actions">

            <!-- זה העיפרון שמפעיל עריכה -->
            <button
              type="button"
              class="edit-btn"
              onclick="event.stopPropagation(); editExpense('${e.id}')"
              aria-label="עריכת הוצאה"
              title="עריכה"
            >✎</button>

            <button
              type="button"
              class="delete-btn"
              onclick="event.stopPropagation(); deleteExpense('${e.id}')"
            >מחיקה</button>

          </div>

        </div>

        <div class="expense-right">
          <div class="expense-amount">${money(e.amount)}</div>
        </div>

      </div>
    `;
  }).join("");
}

function changeSort(){
  const value = document.getElementById("sortSelect").value;

  localStorage.setItem(SORT_KEY,value);

  renderExpenses();
}


/* =========================
   EXPENSE MODAL
========================= */

function populateCategories(){
  const select = document.getElementById("expenseCategory");

  select.innerHTML = categories.map(cat=>
    `<option value="${cat.id}">${cat.icon} ${cat.name}</option>`
  ).join("");
}

function openExpenseModal(){
  editingExpenseId = null;

  document.getElementById("expenseModalTitle").textContent = "הוספת הוצאה";

  document.getElementById("expenseAmount").value = "";
  document.getElementById("expenseDescription").value = "";
  document.getElementById("expenseDate").value = today();

  document.getElementById("expenseCategory").value = "other";

  selectedPayment = "visa";
  updatePaymentButtons();

  openModal("expenseModal");
}


/* =========================
   EDIT EXPENSE
========================= */

function editExpense(id){

  const expense = expenses.find(e=>String(e.id) === String(id));

  if(!expense){
    alert("לא הצלחתי למצוא את ההוצאה לעריכה");
    return;
  }

  editingExpenseId = id;

  document.getElementById("expenseModalTitle").textContent = "עריכת הוצאה";

  document.getElementById("expenseAmount").value = expense.amount || "";

  document.getElementById("expenseCategory").value =
    expense.category || "other";

  document.getElementById("expenseDescription").value =
    expense.description || "";

  document.getElementById("expenseDate").value =
    expense.date || today();

  selectedPayment =
    expense.payment || "visa";

  updatePaymentButtons();

  openModal("expenseModal");
}


/* =========================
   SAVE EXPENSE
========================= */

function saveExpense(){

  const amount = Number(
    document.getElementById("expenseAmount").value
  );

  const category =
    document.getElementById("expenseCategory").value;

  const description =
    document.getElementById("expenseDescription").value.trim();

  const date =
    document.getElementById("expenseDate").value;

  if(!amount || amount <= 0){
    alert("הכניסי סכום");
    return;
  }

  if(!date){
    alert("בחרי תאריך");
    return;
  }

  /* עריכה של הוצאה קיימת */
  if(editingExpenseId !== null){

    const index = expenses.findIndex(
      e=>String(e.id) === String(editingExpenseId)
    );

    if(index !== -1){

      expenses[index] = {
        ...expenses[index],
        amount,
        category,
        payment:selectedPayment,
        description,
        date
      };

    }

  }else{

    /* הוספת הוצאה חדשה */
    expenses.push({
      id:String(Date.now()) + Math.random().toString(16).slice(2),
      amount,
      category,
      payment:selectedPayment,
      description,
      date,
      createdAt:Date.now()
    });

  }

  localStorage.setItem(EXPENSE_KEY,JSON.stringify(expenses));

  editingExpenseId = null;

  closeModal("expenseModal");

  render();
}


/* =========================
   PAYMENT
========================= */

function selectPayment(payment){
  selectedPayment = payment;
  updatePaymentButtons();
}

function updatePaymentButtons(){

  document.querySelectorAll(".payment-option").forEach(button=>{
    button.classList.toggle(
      "selected",
      button.dataset.payment === selectedPayment
    );
  });

}


/* =========================
   DELETE
========================= */

function deleteExpense(id){

  const expense = expenses.find(
    e=>String(e.id) === String(id)
  );

  if(!expense) return;

  const ok = confirm(
    `למחוק את ההוצאה של ${money(expense.amount)}?`
  );

  if(!ok) return;

  expenses = expenses.filter(
    e=>String(e.id) !== String(id)
  );

  localStorage.setItem(EXPENSE_KEY,JSON.stringify(expenses));

  render();
}


/* =========================
   INCOME
========================= */

function renderIncomes(){

  const list = incomes
    .filter(i=>inPeriod(i.date))
    .sort((a,b)=>dateValue(b.date)-dateValue(a.date));

  const container = document.getElementById("incomesList");

  if(!list.length){
    container.innerHTML =
      `<div class="empty">אין הכנסות בתקופה הזו</div>`;
    return;
  }

  container.innerHTML = list.map(i=>`
    <div class="income-item">

      <div class="income-icon">💚</div>

      <div class="income-info">
        <div class="income-name">
          ${escapeHtml(i.description || "הכנסה")}
        </div>

        <div class="income-meta">
          ${formatDate(i.date)}
        </div>
      </div>

      <div class="income-right">
        <div class="income-amount">+${money(i.amount)}</div>
      </div>

    </div>
  `).join("");
}

function openIncomeModal(){

  document.getElementById("incomeAmount").value = "";
  document.getElementById("incomeDescription").value = "";
  document.getElementById("incomeDate").value = today();

  openModal("incomeModal");
}

function saveIncome(){

  const amount = Number(
    document.getElementById("incomeAmount").value
  );

  const description =
    document.getElementById("incomeDescription").value.trim();

  const date =
    document.getElementById("incomeDate").value;

  if(!amount || amount <= 0){
    alert("הכניסי סכום");
    return;
  }

  if(!date){
    alert("בחרי תאריך");
    return;
  }

  incomes.push({
    id:String(Date.now()) + Math.random().toString(16).slice(2),
    amount,
    description,
    date,
    createdAt:Date.now()
  });

  localStorage.setItem(INCOME_KEY,JSON.stringify(incomes));

  closeModal("incomeModal");

  render();
}


/* =========================
   PAYMENT SUMMARY
========================= */

function renderPaymentSummary(){

  const container =
    document.getElementById("paymentSummary");

  container.innerHTML =
    Object.entries(payments).map(([id,payment])=>{

      const total = expenses
        .filter(e=>inPeriod(e.date) && e.payment === id)
        .reduce((sum,e)=>sum + Number(e.amount || 0),0);

      return `
        <div class="payment-card">
          <div class="payment-icon">${payment.icon}</div>
          <div class="payment-name">${payment.name}</div>
          <div class="payment-total">${money(total)}</div>
        </div>
      `;
    }).join("");
}


/* =========================
   CATEGORY MODAL
========================= */

function openCategory(categoryId){

  const category = getCategory(categoryId);

  const list = expenses.filter(
    e=>e.category === categoryId && inPeriod(e.date)
  );

  const total = list.reduce(
    (sum,e)=>sum + Number(e.amount || 0),
    0
  );

  document.getElementById("categoryModalTitle").textContent =
    `${category.icon} ${category.name}`;

  document.getElementById("categoryModalTotal").textContent =
    money(total);

  const container =
    document.getElementById("categoryExpenses");

  if(!list.length){
    container.innerHTML =
      `<div class="empty">אין הוצאות בקטגוריה הזו בתקופה 💕</div>`;
  }else{

    list.sort(
      (a,b)=>dateValue(b.date)-dateValue(a.date)
    );

    container.innerHTML = list.map(e=>{

      const pay = getPayment(e.payment);

      return `
        <div class="expense-item">

          <div class="expense-icon">${category.icon}</div>

          <div class="expense-info">
            <div class="expense-name">
              ${escapeHtml(e.description || category.name)}
            </div>

            <div class="expense-meta">
              ${formatDate(e.date)}
              · ${pay.name} ${pay.icon}
            </div>

            <div class="item-actions">
              <button
                type="button"
                class="edit-btn"
                onclick="closeModal('categoryModal'); editExpense('${e.id}')"
              >✎</button>

              <button
                type="button"
                class="delete-btn"
                onclick="closeModal('categoryModal'); deleteExpense('${e.id}')"
              >מחיקה</button>
            </div>
          </div>

          <div class="expense-right">
            <div class="expense-amount">${money(e.amount)}</div>
          </div>

        </div>
      `;
    }).join("");
  }

  openModal("categoryModal");
}


/* =========================
   MODALS
========================= */

function openModal(id){
  document.getElementById(id).classList.add("show");
}

function closeModal(id){
  document.getElementById(id).classList.remove("show");
}

document.querySelectorAll(".modal-bg").forEach(bg=>{
  bg.addEventListener("click",function(e){
    if(e.target === bg){
      bg.classList.remove("show");
    }
  });
});


/* =========================
   SAFE TEXT
========================= */

function escapeHtml(value){
  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}


/* =========================
   START
========================= */

populateCategories();
render();
updatePaymentButtons();

</script>

</body>
</html>
